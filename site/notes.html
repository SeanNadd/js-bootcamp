<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript-course</title>
  </head>
  <body>
    <h1>Notes App</h1>
    <div id="form-div">
    <form id="note-form">
      <input type="text" id="note-title" placeholder="Enter the note title" name="title"/>
      <input type="text" id="note-body" placeholder="Enter the note body" name="body"/>
      <button type="submit">Add Note</button>
    </form>
    </div>

    <div><select name="sort-selector" id="sortSelector">
      <option value="lastEdited">Sort By Last Edited</option>
      <option value="recent">Sort By Recently Created</option>
      <option value="alphabet">Sort Alphabetically</option>
    </select></div>
    <script type="module" src="notes-app.js"></script>
  </body>
</html>
